<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <rect width="1200" height="780" fill="#070b14"/>
  <style>
    .title { font: 700 42px Arial, sans-serif; }
    .subtitle { font: 23px Arial, sans-serif; }
    .heading { font: 700 28px Arial, sans-serif; }
    .label { font: 20px Arial, sans-serif; }
    .hex { font: 23px Arial, sans-serif; }
  </style>
  <text x="50" y="72" class="title" fill="#f8fafc">ABK Open Mic — Accent Palette Options</text>
  <text x="50" y="112" class="subtitle" fill="#94a3b8">Shown together on the site’s dark background</text>

  <g transform="translate(50 155)">
    <rect width="1100" height="120" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="25" y="52" class="heading" fill="#f8fafc">A — Vivid</text>
    <rect x="260" y="18" width="90" height="84" rx="12" fill="#f725e9"/>
