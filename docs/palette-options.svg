    <text x="365" y="78" class="hex" fill="#f8fafc">#F725E9</text>
    <rect x="530" y="18" width="90" height="84" rx="12" fill="#2dd4bf"/>
    <text x="635" y="45" class="label" fill="#cbd5e1">TEAL</text>
    <text x="635" y="78" class="hex" fill="#f8fafc">#2DD4BF</text>
